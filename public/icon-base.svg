<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!--
    Sierra Coffee — Mountain Logo
    Transparent background, uses currentColor
    White on dark: color="white"
    Black on light: color="black"
  -->
  <!-- Left mountain with brush strokes -->
  <path d="M8 130 L15 118 L24 104 L34 88 L42 96 L52 112 L58 130 Z" fill="currentColor" opacity="0.92"/>
  <path d="M2 134 L18 130 L36 128 L52 130 L60 136 L44 134 L24 134 Z" fill="currentColor" opacity="0.6"/>
  <!-- Brush texture strokes left mountain -->
  <path d="M24 104 L22 110 L20 120 L26 102 Z" fill="currentColor" opacity="0.35"/>
  <path d="M34 88 L32 98 L30 108 L36 86 Z" fill="currentColor" opacity="0.3"/>

  <!-- Center main peak (tallest) -->
  <path d="M58 130 L68 112 L80 90 L92 72 L104 80 L118 102 L126 130 Z" fill="currentColor" opacity="0.97"/>
  <!-- Brush texture center -->
  <path d="M80 90 L78 102 L76 114 L82 88 Z" fill="currentColor" opacity="0.38"/>
  <path d="M92 72 L90 88 L88 102 L94 70 Z" fill="currentColor" opacity="0.32"/>
  <path d="M68 112 L72 104 L74 114 L70 110 Z" fill="currentColor" opacity="0.28"/>

  <!-- Right mountain -->
  <path d="M118 102 L130 86 L144 70 L156 74 L166 88 L172 104 L174 130 L158 128 L134 126 Z" fill="currentColor" opacity="0.88"/>
  <!-- Brush texture right -->
  <path d="M130 86 L128 96 L126 108 L132 84 Z" fill="currentColor" opacity="0.32"/>
  <path d="M144 70 L142 84 L140 96 L146 68 Z" fill="currentColor" opacity="0.28"/>

  <!-- Bottom brush stroke connecting mountains -->
  <path d="M2 136 C30 132 80 130 104 130 C128 130 160 132 178 136 C160 134 130 133 104 133 C78 133 40 134 2 136 Z" fill="currentColor" opacity="0.5"/>

  <!-- SIERRA text -->
  <text x="90" y="168"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="36"
    font-weight="900"
    fill="currentColor"
    text-anchor="middle"
    letter-spacing="6">SIERRA</text>
</svg>