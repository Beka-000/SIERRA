<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sierra Coffee — Нет подключения</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #17130F;
      --surface: #211A15;
      --gold:    #c9a96e;
      --text:    #F7F1E8;
      --muted:   rgba(247,241,232,0.5);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 360px;
      width: 100%;
    }

    .icon-wrap {
      width: 80px;
      height: 80px;
      background: rgba(201,169,110,0.1);
      border: 1px solid rgba(201,169,110,0.25);
      border-radius: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }

    .icon-wrap svg { opacity: 0.85; }

    h1 {
      font-size: 1.375rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .brand {
      font-size: 0.75rem;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
      margin-bottom: 1.25rem;
    }

    p {
      font-size: 0.9rem;
      line-height: 1.65;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    .divider {
      height: 1px;
      background: rgba(255,255,255,0.07);
      margin: 1.5rem 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      height: 48px;
      padding: 0 1.75rem;
      background: var(--gold);
      color: #0f0d0b;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 0.875rem;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, transform 0.1s;
      width: 100%;
    }

    .btn:hover  { background: #d4b87a; }
    .btn:active { transform: scale(0.98); }

    .hint {
      font-size: 0.75rem;
      color: rgba(247,241,232,0.28);
      margin-top: 1rem;
      line-height: 1.5;
    }

    /* Анимированные точки */
    .dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 1.75rem; }
    .dot  { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); opacity: 0.3; animation: pulse 1.4s ease-in-out infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
      40%           { opacity: 1;   transform: scale(1);    }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <img src="/images/logo-white.png" alt="Sierra Coffee" style="width:48px;height:48px;object-fit:contain;" />
    </div>

    <p class="brand">Sierra Coffee</p>
    <h1>Нет подключения к&nbsp;сети</h1>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <p>Проверьте интернет-соединение и попробуйте снова.<br>Кофе ждёт вас&nbsp;☕</p>

    <button class="btn" onclick="location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M3 12a9 9 0 019-9 9.75 9.75 0 016.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
        <path d="M21 12a9 9 0 01-9 9 9.75 9.75 0 01-6.74-2.74L3 16"/>
        <path d="M3 21v-5h5"/>
      </svg>
      Попробовать снова
    </button>

    <p class="hint">При следующем подключении страница загрузится автоматически</p>
  </div>

  <script>
    // Автоматически перезагружаем, когда интернет появился
    window.addEventListener("online", () => location.reload());
  </script>
</body>
</html>
